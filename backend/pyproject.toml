[project]
name = "telco-ai-agent-backend"
version = "0.1.0"
description = "FastAPI backend + LiveKit voice agent worker + cold-call scheduler for the Telco AI agent project"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "apscheduler>=3.10",
    "openpyxl>=3.1",
    "python-multipart>=0.0.12",
    "livekit-agents>=1.7,<1.8",
    "livekit-plugins-elevenlabs>=1.0",
    "livekit-plugins-google>=1.0",
    "livekit-plugins-openai>=1.7",
    "livekit-plugins-silero>=1.0",
    "livekit-api>=0.8",
    "livekit-plugins-deepgram>=1.0",
    "tzdata>=2026.3",
    "num2words>=0.5.14",
    "phonenumbers>=9.0.41",
    "cryptography>=50.0.0",
    "chromadb==1.5.9",
    "llama-index-core>=0.14.23",
    "llama-index-vector-stores-chroma>=0.5.5",
    "llama-index-embeddings-openai-like>=0.4.0",
    "llama-index-readers-file>=0.6.0",
    "pypdf>=6.16.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
